name: Gamma
description: >-
  Gamma (Gamma Tech, Inc.) is an AI-native productivity platform for creating
  presentations, documents, websites, and social posts from a prompt or from
  existing content. Its public Generate API lets developers programmatically
  produce and manage gammas: generate from scratch or from a template, poll the
  asynchronous generation job, list workspace themes and folders, export to PDF,
  PPTX, or PNG, read and manage gammas, and pull document- and card-level
  engagement analytics. Authentication is via an X-API-KEY header (keys begin
  sk-gamma-) on Pro, Ultra, Teams, and Business plans, with credit-based billing.
  Gamma also ships an official remote MCP server (OAuth 2.0 with Dynamic Client
  Registration) and native integrations for Zapier, Make, n8n, Claude, and ChatGPT.
